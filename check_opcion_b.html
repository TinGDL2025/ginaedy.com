    <b style="font-size:12px;letter-spacing:1px">¿QUIÉN VIENE?</b>
    <span id="resumenCheck" style="font-size:11px;color:#8a9a96">0 seleccionados</span>

    <button type="button" onclick="seleccionarTodosChecks(false)" class="btn-small" style="min-width:80px;padding:8px 12px;font-size:10px;background:white;color:#2f4a44">NINGUNO</button>
