<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subir Foto - Gina & Edy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#fdfaf6}.serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body>
<div class="max-w-sm mx-auto bg-white min-h-screen p-6 text-center">
<div class="w-16 h-16 mx-auto rounded-full border border-[#c9a88a] flex items-center justify-center"><span class="serif">G&E</span></div>
<h2 class="serif text-2xl mt-4">Sube tu foto</h2><p class="text-[11px] text-gray-500">Aparecerá en la pantalla gigante</p>
<div class="mt-6 text-left"><label class="text-[11px]">Tu nombre</label><input id="nombre" class="w-full border rounded-full px-4 py-2 text-sm mt-1"></div>
<div class="mt-4"><input type="file" id="file" accept="image/*" class="text-xs"><div id="prevWrap" class="hidden mt-3"><img id="prev" class="w-full rounded-xl max-h-60 object-cover"><p id="feedback" class="hidden mt-2 text-[10px] bg-green-50 p-2 rounded"></p></div></div>
<button onclick="subir()" class="w-full mt-6 bg-[#2f4a44] text-white py-3 rounded-full text-sm">Subir foto a ginaedy.com</button>
<a href="proyeccion.html" target="_blank" class="block mt-3 text-[11px] underline">Ver proyección</a>
<p class="text-[9px] text-gray-400 mt-6">PASO 2: Conectaremos a Supabase gratis para que las fotos queden guardadas en la nube. Por ahora se guardan en este navegador.</p>
</div>
<script>
document.getElementById('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ document.getElementById('prev').src=ev.target.result; document.getElementById('prevWrap').classList.remove('hidden'); document.getElementById('prevWrap').dataset.data=ev.target.result; }; r.readAsDataURL(f); });
function subir(){ const nombre=document.getElementById('nombre').value||'Invitado'; const data=document.getElementById('prevWrap').dataset.data; if(!data){ alert('Selecciona foto'); return; } let fotos=JSON.parse(localStorage.getItem('ge_fotos')||'[]'); fotos.push({id:Date.now(),nombre,data,mesa:'?'}); localStorage.setItem('ge_fotos', JSON.stringify(fotos)); document.getElementById('feedback').textContent='Foto subida de '+nombre+' - Ya está en proyección'; document.getElementById('feedback').classList.remove('hidden'); }
</script>
</body></html>
