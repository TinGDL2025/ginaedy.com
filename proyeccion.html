<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyección - Gina & Edy - ginaedy.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:black;color:white}.serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-black min-h-screen flex flex-col">
<div class="flex justify-between items-center p-4 text-[10px] text-white/50"><span>ginaedy.com/proyeccion</span><span>GINA & EDY 02.01.27 - Mesa</span><button onclick="toggleFull()" class="border px-3 py-1 rounded-full">Pantalla completa</button></div>
<div id="stage" class="flex-1 flex items-center justify-center p-6 text-center">
<div id="content" class="text-center"><p class="serif text-7xl">G&E</p><p class="tracking-[0.4em] text-xs mt-4">ESPERANDO FOTOS</p><p class="text-[10px] mt-2 opacity-50">Las fotos subidas en ginaedy.com/subir-foto.html aparecerán aquí</p></div>
</div>
<div class="p-4 flex justify-center gap-2"><button onclick="prev()" class="bg-white/10 px-4 py-2 rounded-full text-xs">◀</button><button onclick="next()" class="bg-white/10 px-4 py-2 rounded-full text-xs">▶</button><span id="counter" class="text-[10px] opacity-50 px-3 py-2"></span></div>
<script>
let fotos=JSON.parse(localStorage.getItem('ge_fotos')||'[]'); let idx=0;
function render(){ const c=document.getElementById('content'); const counter=document.getElementById('counter'); if(fotos.length===0){ c.innerHTML='<p class=\'serif text-7xl\'>G&E</p><p class=\'tracking-[0.4em] text-xs mt-4\'>ESPERANDO FOTOS</p>'; counter.textContent='0 fotos'; return; } const f=fotos[idx%fotos.length]; c.innerHTML=`<div class="bg-white p-3 rounded-2xl max-w-3xl"><div class="border-[6px] border-[#c9a88a]"><img src="${f.data}" class="max-h-[70vh] max-w-full mx-auto object-contain"></div><p class="text-black text-sm mt-2 serif">${f.nombre} - Mesa ${f.mesa||'?'} - G&E 02.01.27</p><p class="text-black/50 text-[10px]">ginaedy.com</p></div>`; counter.textContent=(idx+1)+'/'+fotos.length; }
function next(){ idx=(idx+1)%Math.max(1,fotos.length); render(); } function prev(){ idx=(idx-1+fotos.length)%Math.max(1,fotos.length); render(); }
function toggleFull(){ const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); }
setInterval(()=>{ let nf=JSON.parse(localStorage.getItem('ge_fotos')||'[]'); if(nf.length!==fotos.length){ fotos=nf; render(); } },2000);
setInterval(next,8000);
render();
</script>
</body></html>
