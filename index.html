<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gina & Edy - 02.01.27</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fdfaf6;color:#2f4a44}
.hero{width:100%;height:50vh;background:#f5f1eb;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
.hero video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.hero.logo{position:relative;z-index:2;background:white;width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #c9a88a}
.card{max-width:500px;margin:-30px auto 0 auto;background:white;border-radius:24px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;position:relative;z-index:5;margin-left:16px;margin-right:16px}
input,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:24px;padding:12px 16px;margin-top:10px;font-size:14px}
button{width:100%;background:#2f4a44;color:white;border:none;padding:14px;border-radius:24px;margin-top:12px;cursor:pointer}
.ok{display:none;margin-top:12px;background:#16a34a;color:white;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div class="hero">
<video id="v" autoplay muted loop playsinline><source src="logo_animado_completo.mp4" type="video/mp4"></video>
<div class="logo" id="logoFallback"><div style="text-align:center"><div style="font-family:serif;font-size:48px;font-weight:bold">G&E</div><div style="font-size:10px;letter-spacing:3px">GINA & EDY<br>02.01.27</div></div></div>
</div>
<div class="card">
<h1 id="saludo" style="font-family:serif;font-size:28px;margin:0">Hola!</h1>
<p style="font-size:12px;color:#888">Miguel Bernal 3432, Col. San Andrés, GDL</p>
<div style="background:#fdfaf6;border-radius:16px;padding:16px;margin-top:16px;text-align:left">
<p style="margin:0;font-size:14px">Tienes <b id="lugares" style="color:#c9a88a">3</b> lugares - Mesa <b id="mesa">10</b></p>
<p id="grupo" style="margin:6px 0 0 0;font-size:11px;color:#888"></p>
<input id="cuantos" type="number" placeholder="¿Cuántos vienen?">
<textarea id="quienes" rows="2" placeholder="Escribe quiénes vienen"></textarea>
<button onclick="confirmar()">CONFIRMAR ASISTENCIA</button>
<div id="ok" class="ok"></div>
</div>
</div>
<script>
var DATA={'010':{t:'Sandra López',l:3,m:'10',g:'Sandra López, Martín Guerrero (esposo), Irene López (mamá)'},'001':{t:'Familia Gina',l:3,m:'1',g:'Georgina Isabel, Mamá, Papá'},'002':{t:'Familia Eduardo',l:2,m:'1',g:'Eduardo, Hermano'}};
var id=new URLSearchParams(window.location.search).get('id')||'010';
var d=DATA[id]||DATA['010'];
document.getElementById('saludo').textContent='Hola '+d.t+'!';
document.getElementById('lugares').textContent=d.l;
document.getElementById('mesa').textContent=d.m;
document.getElementById('grupo').textContent=d.g;
document.getElementById('cuantos').value=d.l;
function confirmar(){var c=document.getElementById('cuantos').value;var q=document.getElementById('quienes').value;var o=document.getElementById('ok');o.innerHTML='Gracias '+d.t+'! Confirmaste '+c+' en Mesa '+d.m+'<br><small>'+q+'</small>';o.style.display='block';}
var v=document.getElementById('v');v.addEventListener('loadeddata',function(){document.getElementById('logoFallback').style.display='none';});
</script>
</body>
</html>
