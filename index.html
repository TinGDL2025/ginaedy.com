<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gina & Edy - 02.01.27</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fdfaf6;color:#2f4a44}
.serif{font-family:'Cormorant Garamond',serif}
.hero{width:100%;background:#fdfaf6;display:flex;align-items:center;justify-content:center;padding:20px 0 10px 0;position:relative}
.hero video{width:100%;max-width:520px;height:auto;max-height:68vh;object-fit:contain;display:block;margin:0 auto;background:#fdfaf6;border-radius:20px}
.fallback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:1}
.container{max-width:520px;margin:0 auto;padding:0 20px 40px 20px}
.card{background:white;border-radius:28px;padding:28px 24px;box-shadow:0 10px 40px rgba(47,74,68,0.08);border:1px solid rgba(201,168,138,0.15);margin-top:12px}
.badge{display:inline-block;background:#fdfaf6;border:1px solid #c9a88a33;border-radius:30px;padding:6px 14px;font-size:10px;letter-spacing:2px;margin-bottom:14px}
.input{width:100%;border:1px solid #e8e0d6;background:#fdfaf6;border-radius:30px;padding:14px 18px;font-size:14px;margin-top:12px;outline:none}
.btn{width:100%;background:#2f4a44;color:white;border:none;padding:16px;border-radius:30px;margin-top:16px;cursor:pointer;font-size:13px;letter-spacing:2px}
.ok{display:none;margin-top:16px;background:#2f4a44;color:white;padding:16px;border-radius:16px;text-align:center;font-size:13px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;font-size:12px}
</style>
</head>
<body>
<div class="hero">
<video id="heroVideo" autoplay muted loop playsinline>
<source src="logo_animado_completo_light.mp4" type="video/mp4">
<source src="logo_animado_completo.mp4" type="video/mp4">
</video>
<div id="fallback" class="fallback">
<div style="width:200px;height:200px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #c9a88a55;margin:0 auto">
<span class="serif" style="font-size:56px;font-weight:700">G&E</span>
</div>
</div>
</div>
<div class="container">
<div class="card">
<div style="text-align:center">
<span class="badge">INVITACIÓN PERSONALIZADA</span>
<h1 id="saludo" class="serif" style="font-size:32px">Hola Sandra López!</h1>
<p style="font-size:11px;color:#8a9a96;margin-top:8px">MIGUEL BERNAL 3432, COL. SAN ANDRÉS, GDL • 02.01.27</p>
</div>
<div style="background:#fdfaf6;border-radius:20px;padding:18px;margin-top:20px">
<div class="detail-row"><span style="color:#8a9a96">TITULAR</span><b id="titularTxt">Sandra López</b></div>
<div class="detail-row"><span style="color:#8a9a96">LUGARES</span><b><span id="lugaresTxt" style="color:#c9a88a">3</span> lugares</b></div>
<div class="detail-row" style="border:none"><span style="color:#8a9a96">MESA</span><b style="background:#2f4a44;color:white;padding:4px 12px;border-radius:20px">Mesa <span id="mesaTxt">10</span></b></div>
<p id="grupoTxt" style="font-size:13px;margin-top:12px">Sandra López, Martín Guerrero (esposo), Irene López (mamá)</p>
</div>
<input id="cuantos" type="number" class="input" value="3">
<textarea id="quienes" rows="2" class="input" placeholder="Ej: Sandra y Martín"></textarea>
<button onclick="confirmar()" class="btn">CONFIRMAR ASISTENCIA</button>
<div id="okBox" class="ok"></div>
<button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Miguel+Bernal+3432+Guadalajara','_blank')" style="width:100%;background:white;border:1px solid #2f4a44;color:#2f4a44;padding:12px;border-radius:30px;margin-top:12px">📍 VER MAPA</button>
</div>
</div>
<script>
const DATA={'010':{t:'Sandra López',l:3,m:'10',g:'Sandra López, Martín Guerrero (esposo), Irene López (mamá)'},'001':{t:'Familia Gina',l:3,m:'1',g:'Georgina Isabel, Mamá, Papá'},'002':{t:'Familia Eduardo',l:2,m:'1',g:'Eduardo, Hermano'}};
const id=new URLSearchParams(window.location.search).get('id')||'010';
const d=DATA[id]||DATA['010'];
document.getElementById('saludo').textContent='Hola '+d.t+'!';
document.getElementById('titularTxt').textContent=d.t;
document.getElementById('lugaresTxt').textContent=d.l;
document.getElementById('mesaTxt').textContent=d.m;
document.getElementById('grupoTxt').textContent=d.g;
document.getElementById('cuantos').value=d.l;
function confirmar(){const c=document.getElementById('cuantos').value;const q=document.getElementById('quienes').value||d.g;const box=document.getElementById('okBox');box.innerHTML=`¡Gracias ${d.t}!<br>Confirmaste <b>${c}</b> en Mesa ${d.m}<br><small>${q}</small>`;box.style.display='block';}
const v=document.getElementById('heroVideo');const fb=document.getElementById('fallback');
v.addEventListener('loadeddata',()=>{fb.style.display='none';});
v.addEventListener('playing',()=>{fb.style.display='none';});
setTimeout(()=>{if(v.readyState<2){fb.style.display='block'}else{fb.style.display='none'}},800);
</script>
</body>
</html>
