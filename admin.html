<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin V5 - Gina & Edy</title>
<style>
  body{font-family:Inter,sans-serif;background:#fcfaf7;margin:0;padding:20px}
  .card{background:white;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  label{font-size:11px;font-weight:700;color:#444;display:block;margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.5px}
  input,select{width:100%;padding:11px 12px;border:1px solid #e5ddd2;border-radius:10px;background:#fffbf6;font-size:14px;box-sizing:border-box}
  .grid{display:grid;gap:12px}
  .grid-5{grid-template-columns:2fr 1.2fr 0.6fr 0.6fr 0.6fr}
  .grid-3{grid-template-columns:1.5fr 1fr 1fr}
  @media(max-width:900px){.grid-5,.grid-3{grid-template-columns:1fr 1fr}}
  .btn{background:#2a4d3a;color:white;border:none;padding:12px 22px;border-radius:24px;cursor:pointer;font-weight:600}
  .btn-outline{background:white;border:1px solid #ddd;color:#333;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:12px}
  .acom-wrap{display:flex;gap:6px;margin-bottom:6px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:#f5efe6;padding:16px;border-radius:12px;text-align:center}
  .stat b{font-size:22px;display:block}
  .stat span{font-size:10px;color:#888;text-transform:uppercase;display:block;margin-top:2px}
</style>
</head>
<body>

<div class="card" style="text-align:center">
  <h2 style="letter-spacing:4px;margin:0">ADMIN - GINA & EDY - 02.01.27 V5</h2>
  <small id="status">Conectado - 0 grupos V3 FINAL</small><br>
  <button class="btn-outline" onclick="cargar()">↻ Actualizar</button>
</div>

<div class="card">
  <h3>+ Agregar Invitado / Familia</h3>
  <div class="grid grid-5" style="margin-top:10px">
    <div><label>Titular Invitación *</label><input id="titular" placeholder="Ej: Familia Rosales"></div>
    <div><label>Celular WhatsApp *</label><input id="celular" placeholder="333..."></div>
    <div><label>Mesa</label><input id="mesa" placeholder="10"></div>
    <div><label>Adultos invitados</label><input id="adultos" type="number" min="0" value="2"></div>
    <div><label>Niños invitados</label><input id="ninos" type="number" min="0" value="0"></div>
  </div>

  <div class="grid grid-3" style="margin-top:14px">
    <div>
      <label>Acompañantes - Agregar persona</label>
      <div id="acomList"><div class="acom-wrap"><input placeholder="Ej: Mama Irene"><button onclick="this.parentElement.remove()">✕</button></div></div>
      <button class="btn-outline" onclick="addAcom()">+ Agregar persona</button>
    </div>
    <div>
      <label>Tipo Mesa Regalo</label>
      <select id="tipo"><option>con mesa de regalo</option><option>sin mesa de regalo</option></select>
    </div>
    <div>
      <label>Categoría (C a G)</label>
      <select id="cat">
        <option value="Familia Gina">Familia Gina</option>
        <option value="Familia Edy">Familia Edy</option>
        <option value="Amigos Gina">Amigos Gina</option>
        <option value="Amigos Edy">Amigos Edy</option>
        <option value="Amigos en Común / Otros">Amigos en Común / Otros</option>
      </select>
      <small style="font-size:10px;color:#999">Enviará 'x' a la columna correspondiente</small>
    </div>
  </div>

  <div style="margin-top:16px"><button class="btn" onclick="guardar()">+ Guardar en Sheet y Generar Link</button> <span id="msg" style="font-size:12px;margin-left:10px"></span></div>
</div>

<div class="card">
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>Invitaciones / Grupos</span></div>
    <div class="stat"><b id="s2">0</b><span>Lugares Reservados</span><small style="font-size:9px">Suma Col M</small></div>
    <div class="stat"><b id="s3">0</b><span>Lugares Confirmados</span><small style="font-size:9px">Suma Col S</small></div>
    <div class="stat"><b id="s4">0</b><span>Lugares Sobrantes</span><small style="font-size:9px">Reservados - Confirmados</small></div>
  </div>
  <input id="busc" placeholder="Buscar titular, mesa..." style="margin:14px 0" onkeyup="filtrar()">
  <div style="overflow:auto"><table id="tabla" width="100%" style="font-size:13px;border-collapse:collapse"><thead><tr style="color:#aaa;font-size:11px"><th>ID</th><th>Titular</th><th>Cat</th><th>Mesa</th><th>M</th><th>X</th><th>Estado</th><th>Link</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
const GS_URL="https://script.google.com/macros/s/AKfycbwWk1g0LJWg1eQ3f2VH5c43UrsMIiB8YLPXpVchr5Ejaynvn38c8cH_TDuYToJd8tgpmw/exec";
let DATA=[];
function addAcom(v=""){const d=document.createElement('div');d.className='acom-wrap';d.innerHTML=`<input value="${v}" placeholder="Nombre"><button onclick="this.parentElement.remove()">✕</button>`;document.getElementById('acomList').appendChild(d);}
function getAcom(){return [...document.querySelectorAll('#acomList input')].map(i=>i.value.trim()).filter(Boolean).join(', ');}
function jsonp(u,cb){const n='cb_'+Date.now();window[n]=d=>{cb(d);delete window[n];s.remove()};const s=document.createElement('script');s.src=u+(u.includes('?')?'&':'?')+'callback='+n;document.body.appendChild(s);}
function cargar(){document.getElementById('status').textContent='Cargando...';jsonp(GS_URL+'?action=list',r=>{DATA=r||[];render(DATA);document.getElementById('status').textContent=`Conectado - ${r.length} grupos V3 FINAL`;});}
function render(list){const tb=document.querySelector('#tabla tbody');tb.innerHTML='';let sumM=0,sumS=0;list.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r.id}</td><td><b>${r.titular}</b><br><small>${r.grupo||''}</small></td><td>${r.categoria||''}</td><td>${r.mesa||''}</td><td>${r.lugaresM||0}</td><td>${r.invitadosX||0}</td><td>${r.estatus||''}</td><td><a href="${r.link}" target="_blank">Ver</a></td>`;tb.appendChild(tr);sumM+=parseInt(r.lugaresM)||0;sumS+=parseInt(r.lugaresConf)||0;});document.getElementById('s1').textContent=list.length;document.getElementById('s2').textContent=sumM;document.getElementById('s3').textContent=sumS;document.getElementById('s4').textContent=sumM-sumS;}
function filtrar(){const q=document.getElementById('busc').value.toLowerCase();render(DATA.filter(r=>(r.titular+r.grupo+r.mesa).toLowerCase().includes(q)));}
function guardar(){const titular=document.getElementById('titular').value.trim();const celular=document.getElementById('celular').value.trim();if(!titular||!celular){alert('Titular y Celular obligatorios');return;}const payload={action:'add',titular,celular,mesa:document.getElementById('mesa').value,adultos:document.getElementById('adultos').value,ninos:document.getElementById('ninos').value,grupo:getAcom(),tipo:document.getElementById('tipo').value,categoria:document.getElementById('cat').value};const qs=Object.keys(payload).map(k=>k+'='+encodeURIComponent(payload[k])).join('&');document.getElementById('msg').textContent='Guardando...';jsonp(GS_URL+'?'+qs,r=>{document.getElementById('msg').textContent='OK ID '+r.id;cargar();});}
window.onload=cargar;
</script>
</body>
</html>
