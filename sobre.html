<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f2ebe1;overflow:hidden}

/* ETAPA SOBRE - 95% */
.stage{width:96vw;max-width:680px;position:relative;transition:opacity .9s ease;display:flex;flex-direction:column;align-items:center;gap:18px}
.stage.out{opacity:0;pointer-events:none}
.top-text{font-family:'EB Garamond', serif;font-style:italic;font-size:26px;color:#c8b08f;letter-spacing:.02em}
.video-box{width:95%;margin:0 auto;aspect-ratio:16/9.8;overflow:hidden;background:#f2ebe1;position:relative;border-radius:4px;box-shadow:0 12px 35px rgba(0,0,0,.15)}
.video-box video{width:100%;height:95%;object-fit:cover;display:block}
#ondaVideo{position:absolute;inset:0;z-index:1;width:100%;height:95%}
#confetiVideo{position:absolute;inset:0;z-index:2;display:none;width:100%;height:95%}
#confetiVideo.active{display:block}
.seal-hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;z-index:5;cursor:pointer}
.overlay-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;background:rgba(255,255,255,.92);border:0;padding:9px 18px;border-radius:22px;font-size:10px;letter-spacing:.2em;cursor:pointer}
.bottom-texts{text-align:center;display:flex;flex-direction:column;gap:6px}
.con-amor{font-family:'EB Garamond', serif;font-style:italic;font-size:18px;color:#5a3a28}
.nombres{font-family:'Cormorant Garamond', serif;font-size:28px;color:#1e3a32}
.fecha{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.18em;color:#1e3a32;margin-top:4px}

/* HOJA FINAL - 95% PAREJA, SIN EXTRAS */
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .9s ease}
.card-layer.active{pointer-events:auto;opacity:1}
.card-final{
  width:95%;max-width:440px;background:#fffdf8;border-radius:18px;
  padding:36px 24px 28px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:8px
}
/* TIENES UNA INVITACION - mas grande pero proporcion arriba mas chico */
.small-label{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.32em;color:#9a9a9a;text-transform:uppercase}
.con-amor-final{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:#8a6a5a;margin-top:8px}
.guest-name{
  font-family:'Cormorant Garamond',serif;font-size:30px;color:#1e3a32;
  font-weight:400;letter-spacing:.01em;
}
.divider{width:48px;height:1px;background:#e6d5c3;margin:10px 0}
.nos-casamos{
  font-family:'Great Vibes', cursive;
  font-size:52px;color:#1e3a32;line-height:1.1;
  margin:6px 0;
}
.gina-edy{font-family:'Cormorant Garamond',serif;font-size:26px;color:#1e3a32;margin-top:2px}
.fecha-final{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.22em;color:#6a7a75;margin-top:2px}
/* SELLO COMO BOTON - igual al del sobre */
.seal-final{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #e8d0a0, #c8a86a);
  border:1px solid #b8975a;color:#5a3a20;
  font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.08em;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);
  margin-top:18px;transition:transform .2s
}
.seal-final:hover{transform:scale(1.06)}
.cta-text{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.25em;color:#1e3a32;margin-top:14px;text-transform:uppercase}

@media (max-width:600px){
  .stage{width:100vw;gap:14px}
  .top-text{font-size:22px}
  .video-box{width:92vw;aspect-ratio:1/1.05}
  .video-box video,#ondaVideo,#confetiVideo{height:100%}
  .seal-hit{width:180px;height:180px}
  .card-final{width:92vw;padding:28px 18px 24px}
  .nos-casamos{font-size:44px}
  .guest-name{font-size:26px}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="top-text">Tienes una invitación</div>
  <div class="video-box">
    <video id="ondaVideo" autoplay loop muted playsinline preload="auto"><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <button class="overlay-hint" id="hint">Toca el sello</button>
    <div class="seal-hit" id="seal"></div>
  </div>
  <div class="bottom-texts">
    <div class="con-amor">Con amor,</div>
    <div class="nombres">Gorgina Isabel & Eduardo</div>
    <div class="fecha">02 . 01 . 27</div>
  </div>
</div>

<!-- HOJA FINAL CORREGIDA -->
<div class="card-layer" id="cardLayer">
  <div class="card-final">
    <div class="small-label">Tienes una invitación</div>
    <div class="con-amor-final">Con amor,</div>
    <div class="guest-name" id="guestName">Eduardo Magallón</div>
    <div class="divider"></div>
    <div class="nos-casamos">Nos casamos</div>
    <div class="gina-edy">Gina & Edy</div>
    <div class="fecha-final">02.01.27</div>
    <div class="seal-final" id="sealFinal">G&E</div>
    <div class="cta-text">Ver invitación completa</div>
  </div>
</div>

<script>
var onda=document.getElementById('ondaVideo');
var conf=document.getElementById('confetiVideo');
var hint=document.getElementById('hint');
var stage=document.getElementById('stage');
var cardLayer=document.getElementById('cardLayer');
onda.muted=true; onda.play().catch(()=>{});
var soundOn=false, clickCount=0, opened=false;
function enableSound(){ if(soundOn) return; soundOn=true; onda.muted=false; onda.volume=0.6; onda.play(); conf.muted=false; }
function firstClick(){ enableSound(); clickCount=1; hint.textContent='Ahora ábrelo ✨'; document.getElementById('seal').style.transform='translate(-50%,-50%) scale(1.05)'; setTimeout(()=>{document.getElementById('seal').style.transform='translate(-50%,-50%) scale(1)';},200); }
function openSeq(){ if(opened) return; opened=true; hint.style.opacity='0'; setTimeout(()=>{conf.classList.add('active');conf.currentTime=0;conf.muted=false;conf.volume=0.9;conf.play();onda.pause();},120); conf.ontimeupdate=()=>{ if(conf.currentTime>=2.85){ conf.pause(); stage.classList.add('out'); cardLayer.classList.add('active'); }}}
document.getElementById('seal').onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
hint.onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
// AHORA EL SELLO ES EL BOTON
document.getElementById('sealFinal').onclick=()=>{ window.location.href='index.html'+window.location.search; };
</script>
</body>
</html>
