<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy - Sobre v3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Great+Vibes&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f2ebe1;overflow:hidden}
.stage{width:96vw;max-width:680px;position:relative;transition:opacity .9s ease}
.stage.out{opacity:0;pointer-events:none}
.video-box{width:92vw;max-width:520px;aspect-ratio:3/4.8;margin:0 auto;overflow:hidden;background:transparent;position:relative}
.video-box.onda-mode{overflow:visible}
#ondaVideo{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:1;object-fit:contain;transform:scale(1.60);background:transparent}
#confetiVideo{width:100%;height:100%;position:absolute;inset:0;z-index:2;display:none;object-fit:cover;background:#f2ebe1;transform:scale(0.72);opacity:0;transition:opacity .5s, transform .6s}
#confetiVideo.active{display:block;opacity:1}
#confetiVideo.zoom-final{transform:scale(1.02)}
.seal-hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;z-index:5;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 0 24px;pointer-events:none}
.top{pointer-events:auto;text-align:center}
.top .tienes{font-family:'Cormorant Garamond',serif;font-style:italic;color:#c2a68a;font-size:22px}
.top #labelId{font-family:'Cormorant Garamond',serif;font-weight:700;color:#1e3d2f;font-size:26px;margin-top:8px;min-height:32px}
.bottom{pointer-events:auto;text-align:center;margin-top:auto}
.bottom .con-amor{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:#8a6a5a}
.bottom .fijos{font-family:'Cormorant Garamond',serif;font-size:22px;color:#1a3a2f;margin-top:2px}
.bottom .fecha{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.22em;color:#7a8a85;margin-top:6px}
#hint{pointer-events:auto;position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);border:0;padding:8px 14px;border-radius:20px;font-size:10px;letter-spacing:.18em;cursor:pointer}
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .9s}
.card-layer.active{pointer-events:auto;opacity:1}
.card{width:92vw;max-width:400px;background:#fff;border-radius:22px;padding:42px 32px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="video-box onda-mode" id="videoBox">
    <video id="ondaVideo" autoplay loop muted playsinline preload="auto"><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <div class="overlay">
      <div class="top">
        <div class="tienes">Tienes una invitación</div>
        <div id="labelId">Cargando...</div>
      </div>
      <div class="bottom">
        <div class="con-amor">Con amor,</div>
        <div class="fijos">Gorgina Isabel & Eduardo</div>
        <div class="fecha">02 . 01 . 27</div>
      </div>
      <button id="hint">Toca el sello</button>
    </div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>
<div class="card-layer" id="cardLayer">
  <div class="card">
    <div style="font-size:10px;letter-spacing:.32em;color:#9a9a9a">TIENES UNA INVITACIÓN</div>
    <div id="guest" style="font-family:'Cormorant Garamond',serif;font-size:28px;color:#1a3a2f;margin-top:8px">Cargando...</div>
    <div style="margin-top:20px;cursor:pointer" id="goBtn">VER INVITACIÓN COMPLETA</div>
  </div>
</div>
<script>
// === CONFIG GS - MISMO QUE ADMIN E INDEX ===
const GS_URL='https://script.google.com/macros/s/AKfycbwWk1g0LJWg1eQ3f2VH5c43UrsMIiB8YLPXpVchr5Ejaynvn38c8cH_TDuYDuYToJd8tgpmw/exec';

// === JSONP EXACTO COMO ADMIN.V19 ===
function jsonp(url, cb){
  var cbName='cb_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  window[cbName]=function(data){
    try{ cb(data); }catch(e){ console.log(e); }
    delete window[cbName];
    var el=document.getElementById(cbName); if(el) el.remove();
  };
  var s=document.createElement('script');
  s.id=cbName;
  s.src=url + (url.indexOf('?')>=0 ? '&' : '?') + 'callback='+cbName;
  s.onerror=function(){ delete window[cbName]; s.remove(); cb(null); };
  document.head.appendChild(s);
}

function getId(){ return (new URLSearchParams(location.search).get('id')||'001').trim(); }

function pintar(titular, id){
  var el=document.getElementById('labelId');
  var el2=document.getElementById('guest');
  if(titular){
    el.textContent=titular;
    if(el2) el2.textContent=titular;
  } else {
    el.textContent='ID: '+id;
    if(el2) el2.textContent='ID: '+id;
  }
}

// === CARGA SIMPLE - COMUNICADO CON SHEET ===
function loadGuest(){
  var id=getId();
  // Mismo formato que te funciona en admin: ?action=getById&id=XXX
  jsonp(GS_URL+'?action=getById&id='+encodeURIComponent(id), function(r){
    console.log('RESPUESTA GS getById:', r);
    if(r){
      // Tu Code.gs regresa {t:titular, id, ...} segun me dijiste
      var obj = r.data ? r.data : r;
      var titular = obj.t || obj.titular || obj.TITULAR || null;
      if(titular){
        pintar(titular, id);
        return;
      }
      // Si viene en lista
      if(Array.isArray(obj)){
        var f=obj.find(x=>String(x.id).toUpperCase()===id.toUpperCase());
        if(f){ pintar(f.t || f.titular, id); return; }
      }
    }
    // Si getById no dio, intenta list como hace admin
    jsonp(GS_URL+'?action=list', function(list){
      console.log('RESPUESTA GS list:', list);
      var lista = Array.isArray(list) ? list : (list.data || list.list || []);
      var it = lista.find(x=>String(x.id).toUpperCase()===id.toUpperCase());
      if(it){
        pintar(it.t || it.titular, id);
      } else {
        // Si no lo encuentra, deja ID para que veas que si cambio direccion
        pintar(null, id);
      }
    });
  });
}
loadGuest();

// === EFECTOS QUE CUIDAS - SIN TOCAR ===
var onda=document.getElementById('ondaVideo');
var conf=document.getElementById('confetiVideo');
var hint=document.getElementById('hint');
var stage=document.getElementById('stage');
var cardLayer=document.getElementById('cardLayer');
var videoBox=document.getElementById('videoBox');
onda.muted=true; onda.play().catch(()=>{});
var soundOn=false,clickCount=0,opened=false;
function enableSound(){if(soundOn)return;soundOn=true;onda.muted=false;onda.volume=0.6;onda.play();conf.muted=false;}
function firstClick(){enableSound();clickCount=1;hint.textContent='Ahora ábrelo ✨';if(navigator.vibrate)navigator.vibrate(20);}
function openSeq(){
  if(opened)return;opened=true;
  hint.style.opacity='0';
  if(navigator.vibrate)navigator.vibrate([40,30,80]);
  conf.classList.add('active'); conf.currentTime=0; conf.muted=false; conf.volume=0.9; conf.play();
  setTimeout(()=>{ onda.style.opacity='0'; videoBox.classList.remove('onda-mode'); },500);
  setTimeout(()=>{ onda.pause(); },800);
  conf.ontimeupdate=()=>{
    if(conf.currentTime>=2.2 && !conf.classList.contains('zoom-final')) conf.classList.add('zoom-final');
    if(conf.currentTime>=2.85){ conf.pause(); stage.classList.add('out'); cardLayer.classList.add('active'); }
  }
}
document.getElementById('seal').onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
hint.onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
function goIndex(){ location.href='index.html?id='+getId(); }
document.getElementById('goBtn').onclick=goIndex;
</script>
</body>
</html>
