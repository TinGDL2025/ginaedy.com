<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f2ebe1;overflow:hidden}
.stage{width:96vw;max-width:680px;position:relative;transition:.85s}
.stage.out{transform:scale(.84) translateY(-70px);opacity:0;pointer-events:none}
.video-box{width:100%;aspect-ratio:16/8.5;overflow:hidden;background:#f2ebe1;position:relative}
.video-box video{width:100%;height:118%;object-fit:cover;transform:translateY(-8%);display:block;background:#f2ebe1}
#ondaVideo{position:absolute;inset:0;z-index:1;width:100%;height:118%;transform:translateY(-8%)}
#confetiVideo{position:absolute;inset:0;z-index:2;display:none;width:100%;height:118%;transform:translateY(-8%)}
#confetiVideo.active{display:block}
.seal-hit{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;z-index:5;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0;pointer-events:none}
.overlay button{pointer-events:auto}
.tap{display:none !important}
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none}
.card-layer.active{pointer-events:auto}
.card{width:90%;max-width:400px;background:#fff;border-radius:22px;padding:32px;text-align:center;transform:translateY(60px) scale(.88);opacity:0;transition:.9s}
.card-layer.active .card{transform:translateY(0) scale(1);opacity:1}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="video-box" id="box">
    <video id="ondaVideo" autoplay loop muted playsinline preload="auto"><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <div class="overlay"><div style="font-size:10px;letter-spacing:.3em">Tienes una invitación</div><button id="hint">Toca el sello</button></div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>
<div class="card-layer" id="cardLayer">
  <div class="card">
    <div id="guest">Invitado Especial</div>
    <div style="font-size:40px;margin:10px 0">Nos casamos<br>Gina & Edy</div>
    <button id="go">Ver invitación completa</button>
  </div>
</div>
<script>
var onda=document.getElementById('ondaVideo');
var conf=document.getElementById('confetiVideo');
var soundEnabled=false;
onda.muted=true; onda.play().catch(()=>{});
function enableSound(){
  if(soundEnabled) return;
  soundEnabled=true;
  onda.muted=false; onda.volume=0.6; onda.play();
  conf.muted=false;
}
var opened=false;
function openSeq(){
  if(!soundEnabled) enableSound();
  if(opened) return; opened=true;
  document.querySelector('.overlay').style.opacity='0';
  setTimeout(()=>{conf.classList.add('active');conf.currentTime=0;conf.muted=false;conf.volume=0.9;conf.play();onda.pause();},180);
  conf.ontimeupdate=()=>{
    if(conf.currentTime>=2.85){
      conf.pause();
      document.getElementById('stage').classList.add('out');
      document.getElementById('cardLayer').classList.add('active');
    }
  }
}
document.getElementById('seal').onclick=openSeq;
document.getElementById('hint').onclick=openSeq;
document.getElementById('box').onclick=()=>{if(!soundEnabled) enableSound(); if(!opened) openSeq();};
document.getElementById('go').onclick=()=>{window.location.href='index.html'+window.location.search;};
</script>
</body>
</html>
