<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Digital - Boda</title>
    <style>
        /* Estilos base limpios que respetan el diseño original */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #444;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .detalles {
            margin: 20px 0;
            text-align: left;
            background: #fafafa;
            padding: 15px;
            border-radius: 5px;
        }
        .detalles p {
            margin: 8px 0;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        #mensaje-estado {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Estás Invitado!</h1>
        <div id="cargando">Cargando los datos de tu invitación...</div>

        <div id="contenido-invitacion" style="display: none;">
            <div class="detalles">
                <p><strong>Titular:</strong> <span id="lbl-titular"></span></p>
                <p><strong>Lugares Asignados:</strong> <span id="lbl-lugares"></span></p>
                <p><strong>Mesa:</strong> <span id="lbl-mesa"></span></p>
            </div>

            <form id="form-confirmacion" onsubmit="enviarAsistencia(event)">
                <div class="form-group">
                    <label for="inputLugaresConfirmados">Lugares que confirman asistir:</label>
                    <input type="number" id="inputLugaresConfirmados" required min="0">
                </div>

                <div class="form-group">
                    <label for="inputNombresConfirmados">Nombres de los asistentes:</label>
                    <input type="text" id="inputNombresConfirmados" placeholder="Escribe los nombres completos" required>
                </div>

                <button type="submit" id="btn-enviar">Confirmar Asistencia</button>
            </form>
            <div id="mensaje-estado"></div>
        </div>
    </div>

    <script>
        // REEMPLAZA ESTA URL CON TU WEB APP DE GOOGLE APPS SCRIPT EXACTA (la misma que usa tu admin e index)
        const URL_GOOGLE_SCRIPT = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

        // Obtener el ID de la URL (ejemplo: sobre.html?id=001)
        const urlParams = new URLSearchParams(window.location.search);
        const idInvitado = urlParams.get('id');

        document.addEventListener("DOMContentLoaded", () => {
            if (!idInvitado) {
                document.getElementById("cargando").innerText = "No se encontró un código de invitación válido en el enlace.";
                return;
            }

            // Petición GET para recuperar los datos del invitado desde el Google Sheet sin tocar formatos
            fetch(`${URL_GOOGLE_SCRIPT}?id=${idInvitado}`)
                .then(response => response.json())
                .then(resultado => {
                    // Soporte para respuestas estándar de Apps Script
                    const datos = resultado.data || resultado;
                    
                    if (resultado.status === "success" || datos) {
                        document.getElementById("lbl-titular").innerText = datos["Titular Invitación"] || "Invitado";
                        document.getElementById("lbl-lugares").innerText = datos["Lugares Asignados"] || "0";
                        document.getElementById("lbl-mesa").innerText = datos["Mesa"] || datos["Mesa Asignada"] || "Por asignar";
                        
                        // Precargar si ya hubiera datos previos
                        if(datos["Lugares Confirmados"]) {
                            document.getElementById("inputLugaresConfirmados").value = datos["Lugares Confirmados"];
                        }
                        if(datos["Nombres Confirmados (quién viene)"]) {
                            document.getElementById("inputNombresConfirmados").value = datos["Nombres Confirmados (quién viene)"];
                        }

                        document.getElementById("cargando").style.display = "none";
                        document.getElementById("contenido-invitacion").style.display = "block";
                    } else {
                        document.getElementById("cargando").innerText = "Invitación no encontrada en el sistema.";
                    }
                })
                .catch(error => {
                    console.error("Error al conectar:", error);
                    document.getElementById("cargando").innerText = "Error al cargar la información. Inténtalo más tarde.";
                });
        });

        // Función para enviar la asistencia mediante POST respetando la lógica actual de tu GS
        function enviarAsistencia(e) {
            e.preventDefault();
            
            const btn = document.getElementById("btn-enviar");
            const mensajeEstado = document.getElementById("mensaje-estado");
            
            btn.disabled = true;
            btn.innerText = "Enviando...";
            mensajeEstado.innerText = "";

            const payload = {
                id: idInvitado,
                lugaresConfirmados: document.getElementById("inputLugaresConfirmados").value,
                nombresConfirmados: document.getElementById("inputNombresConfirmados").value
            };

            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                mode: "no-cors", // Requerido para llamadas externas a Google Apps Script
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                mensajeEstado.style.color = "green";
                mensajeEstado.innerText = "¡Muchas gracias! Tu confirmación ha sido guardada con éxito.";
                btn.innerText = "¡Confirmado!";
            })
            .catch(error => {
                console.error("Error al enviar:", error);
                mensajeEstado.style.color = "red";
                mensajeEstado.innerText = "Hubo un problema al registrar. Por favor, intenta de nuevo.";
                btn.disabled = false;
                btn.innerText = "Confirmar Asistencia";
            });
        }
    </script>
</body>
</html>
