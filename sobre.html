<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitación Gina & Edy</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body style="background:#fdfaf6" class="min-h-screen flex items-center justify-center p-6">
<div class="max-w-md w-full bg-white rounded- shadow-xl p-8 text-center">
<h1 style="font-size:2rem">Gina & Edy<br><span style="font-size:12px;letter-spacing:3px">02.01.27</span></h1>
<div id="loading" class="mt-8 text-xs">Cargando invitación...</div>
<div id="ok" class="hidden">
<h2 id="nombre" class="text-2xl font-bold mt-6"></h2>
<p id="tipo" class="text-xs mt-2"></p>
<p id="mesa" class="text-xs mt-1"></p>
<a id="btn" href="#" class="mt-6 inline-block bg-black text-white px-6 py-3 rounded-full text-sm w-full">Ver invitación</a>
</div>
<div id="err" class="hidden text-xs text-red-500 mt-6">No se encontró ID</div>
</div>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQbzyIFPJGo2kKoUxfcMMtpvbCzOS-0ixuVsPJLDCtJkSqRWNtoRsieg-fGPldUmw/pub?output=csv";
const id= (new URLSearchParams(location.search).get('id')||'').padStart(3,'0');
fetch(CSV).then(r=>r.text()).then(t=>{
 let rows=t.split('\n');
 for(let i=1;i<rows.length;i++){
  let c=rows[i].split(',');
  if(!c[0])continue;
  let rid=c[0].trim().padStart(3,'0');
  if(rid===id){
   document.getElementById('loading').classList.add('hidden');
   document.getElementById('ok').classList.remove('hidden');
   document.getElementById('nombre').textContent=c[1];
   document.getElementById('tipo').textContent=c[9];
   document.getElementById('mesa').textContent='Mesa: '+c[13]+' | Lugares: '+c[12];
   document.getElementById('btn').href='index.html?id='+rid;
   return;
  }
 }
 document.getElementById('loading').classList.add('hidden');
 document.getElementById('err').classList.remove('hidden');
});
</script></body></html>
