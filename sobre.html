<script>
// CHECADO TU VIDEO sobre_confeti.mp4
// 0.0s - sobre cerrado
// 1.2s - sobre con sello G&E
// 2.3s - EXPLOSION confeti dorado + abre
// 3.5s - se ve "Nos casamos"
// 5.9s - papel blanco limpio
// TRANSICION debe ser a los 2.3-2.5s, no 2.85s

function openSeq(){
  if(opened) return; opened=true;
  hint.style.opacity='0';
  setTimeout(()=>{
    conf.classList.add('active');
    conf.currentTime=0; 
    conf.muted=false; conf.volume=0.9; 
    conf.play(); 
    onda.pause();
  },80);

  // AJUSTE EXACTO A TU VIDEO
  conf.ontimeupdate=()=>{
    // antes 2.85, ahora 2.35 = justo en la explosión
    if(conf.currentTime>=2.35){
      conf.pause();
      stage.classList.add('out');
      cardLayer.classList.add('active');
      setTimeout(launchGoldConfetti, 80); // sigue del video
    }
  }
}
</script>
