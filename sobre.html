<style>
/* NUEVO TOP CON ID ARRIBA */
.top-envelope{
  text-align:center;
  margin-bottom:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.guest-top-envelope{
  font-family:'Cormorant Garamond',serif;
  font-size:28px; /* MISMO QUE ULTIMA PAGINA */
  color:#1a3a2f;  /* MISMO QUE ULTIMA PAGINA */
  font-weight:500;
}
.label-top-envelope{
  font-family:system-ui,sans-serif;
  font-size:10px; /* MISMO QUE ULTIMA PAGINA */
  letter-spacing:.32em;
  color:#1a3a2f; /* MISMO QUE ID PARA QUE NO SE PIERDA COMO PEDISTE */
  text-transform:uppercase;
}
@media(max-width:600px){
  .guest-top-envelope{font-size:26px}
}
</style>

<div class="stage" id="stage">
  <!-- ID ARRIBA + TIENES UNA INVITACION ABAJO -->
  <div class="top-envelope">
    <div class="guest-top-envelope" id="guestTop">Eduardo Magallón</div>
    <div class="label-top-envelope">Tienes una invitación</div>
  </div>
  
  <div class="video-box">
    <video id="ondaVideo" autoplay loop muted playsinline><source src="sobre_onda.mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4"></video>
    <div class="overlay"><button id="hint">Toca el sello</button></div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>

<script>
// TRANSICION TIEMPO COMPLETO VIDEO CONFETI
function openSeq(){
  if(opened) return; opened=true;
  hint.style.opacity='0';
  setTimeout(()=>{ 
    conf.classList.add('active'); 
    conf.currentTime=0; 
    conf.muted=false; 
    conf.volume=0.9; 
    conf.play(); 
    onda.pause(); 
  },120);
  
  // AHORA ESPERA TODO EL VIDEO (5.9s) PARA QUE APAREZCA HOJA FINAL YA COMPLETA
  conf.onended = () => {
    stage.classList.add('out');
    cardLayer.classList.add('active');
    setTimeout(launchGoldConfetti, 100);
  };
  
  // Fallback por si onended no dispara
  conf.ontimeupdate=()=>{
    if(conf.currentTime>=5.8){ // TIEMPO COMPLETO
      conf.pause();
      stage.classList.add('out');
      cardLayer.classList.add('active');
      setTimeout(launchGoldConfetti, 100);
    }
  }
}

// SHEET CON LOS DOS IDS
async function loadGuest(){ 
  try{ 
    const r=await fetch(APP_URL); 
    const d=await r.json(); 
    const it=d.find(x=>String(x.id)===String(getId())); 
    if(it){
      document.getElementById('guest').textContent=it.titular;
      document.getElementById('guestTop').textContent=it.titular;
    }
  }catch(e){} 
}
</script>
