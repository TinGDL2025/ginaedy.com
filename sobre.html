<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy - Sobre v7 Limpio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f2ebe1;overflow:hidden}
.stage{width:96vw;max-width:680px;position:relative;transition:opacity .9s}
.stage.out{opacity:0;pointer-events:none}
.video-box{width:92vw;max-width:520px;aspect-ratio:3/4.8;margin:0 auto;position:relative;overflow:visible}
#ondaVideo{position:absolute;inset:0;width:100%;height:100%;z-index:1;object-fit:contain;transform:scale(1.60);background:transparent}
#confetiVideo{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:none;object-fit:cover;background:#f2ebe1;transform:scale(0.72);opacity:0;transition:opacity .5s,transform .6s}
#confetiVideo.active{display:block;opacity:1}
#confetiVideo.zoom-final{transform:scale(1.02)}
.seal-hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;z-index:5;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 12px 18px;pointer-events:none}
.top{text-align:center;pointer-events:auto}
.tienes{font-family:'Cormorant Garamond',serif;font-style:italic;color:#c2a68a;font-size:22px}
#labelId{font-family:'Cormorant Garamond',serif;font-weight:700;color:#1e3d2f;font-size:26px;margin-top:8px;min-height:32px;line-height:1.15}
.bottom{text-align:center;pointer-events:auto;margin-top:auto}
.con-amor{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:#8a6a5a}
.fijos{font-family:'Cormorant Garamond',serif;font-size:22px;color:#1a3a2f;margin-top:2px}
.fecha{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.22em;color:#7a8a85;margin-top:6px}
#hint{pointer-events:auto;position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);border:0;padding:8px 14px;border-radius:20px;font-size:10px;letter-spacing:.18em;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .9s}
.card-layer.active{pointer-events:auto;opacity:1}
.card{width:92vw;max-width:400px;background:#fff;border-radius:22px;padding:42px 32px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12)}
</style>
</head>
<body>
<!-- SOBRE: Estructura intacta onda + confeti -->
<div class="stage" id="stage">
  <div class="video-box" id="videoBox">
    <video id="ondaVideo" autoplay loop muted playsinline preload="auto"><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <div class="overlay">
      <div class="top">
        <div class="tienes">Tienes una invitación</div>
        <!-- Aqui va B2 de Sheet - antes estaba Sandra Lopez -->
        <div id="labelId">Sandra Lopez</div>
      </div>
      <div class="bottom">
        <div class="con-amor">Con amor,</div>
        <div class="fijos">Gorgina Isabel & Eduardo</div>
        <div class="fecha">02 . 01 . 27</div>
      </div>
      <button id="hint">Toca el sello</button>
    </div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>

<!-- CARTA SIGUIENTE: Aqui tambien debe aparecer nombre (donde dice invitado) -->
<div class="card-layer" id="cardLayer">
  <div class="card">
    <div style="font-size:10px;letter-spacing:.32em;color:#9a9a9a">TIENES UNA INVITACIÓN</div>
    <div id="guest" style="font-family:'Cormorant Garamond',serif;font-size:28px;color:#1a3a2f;margin-top:8px">Sandra Lopez</div>
    <div style="margin-top:20px;cursor:pointer" id="goBtn">VER INVITACIÓN COMPLETA</div>
  </div>
</div>

<!-- ===== BLOQUE 1: CONEXION GS IGUAL QUE INDEX - NO TOCAR VIDEO ===== -->
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWk1g0LJWg1eQ3f2VH5c43UrsMIiB8YLPXpVchr5Ejaynvn38c8cH_TDuYDuYToJd8tgpmw/exec";

function renderData(obj){
  // Esta es la funcion que tu index usa - obj.t es B2
  if(!obj){
    console.log('GS vacio');
    return;
  }
  console.log('GS renderData:', obj);
  var titular = obj.t || obj.titular || "";
  var id = obj.id || "";
  var elTop = document.getElementById('labelId');
  var elCard = document.getElementById('guest');

  if(obj.status === "no encontrado"){
    // Aqui antes decia ID no encontrado o Invitado - ahora pinta ID
    if(elTop) elTop.textContent = "ID: "+id;
    if(elCard) elCard.textContent = "ID: "+id;
    return;
  }
  if(titular){
    if(elTop) elTop.textContent = titular; // B2 en sobre onda
    if(elCard) elCard.textContent = titular; // B2 en carta siguiente (donde decia invitado)
  }
}
</script>

<!-- ===== BLOQUE 2: CARGA GS - MISMA LINEA QUE INDEX ===== -->
<script>
const idParam = new URLSearchParams(window.location.search).get('id')||'001';
let gs = document.createElement('script');
gs.src = APPS_SCRIPT_URL+"?id="+idParam+"&callback=renderData";
document.body.appendChild(gs);
</script>

<!-- ===== BLOQUE 3: VIDEO ONDA + CONFETI - SEPARADO, NO CHOCA CON GS ===== -->
<script>
var onda=document.getElementById('ondaVideo');
var conf=document.getElementById('confetiVideo');
var hint=document.getElementById('hint');
var stage=document.getElementById('stage');
var cardLayer=document.getElementById('cardLayer');
var videoBox=document.getElementById('videoBox');

onda.muted=true;
onda.play().catch(function(){});

var soundOn=false,clickCount=0,opened=false;
function enableSound(){ if(soundOn) return; soundOn=true; onda.muted=false; onda.volume=0.6; onda.play(); conf.muted=false; }
function firstClick(){ enableSound(); clickCount=1; hint.textContent='Ahora ábrelo ✨'; if(navigator.vibrate) navigator.vibrate(20); }
function openSeq(){
  if(opened) return; opened=true;
  hint.style.opacity='0';
  if(navigator.vibrate) navigator.vibrate([40,30,80]);
  conf.classList.add('active');
  conf.currentTime=0;
  conf.muted=false;
  conf.volume=0.9;
  conf.play().catch(function(){});
  setTimeout(function(){ onda.style.opacity='0'; },500);
  setTimeout(function(){ onda.pause(); },800);
  conf.ontimeupdate=function(){
    if(conf.currentTime>=2.2 && !conf.classList.contains('zoom-final')) conf.classList.add('zoom-final');
    if(conf.currentTime>=2.85){ conf.pause(); stage.classList.add('out'); cardLayer.classList.add('active'); }
  };
}
document.getElementById('seal').onclick=function(){ if(clickCount===0) firstClick(); else openSeq(); };
hint.onclick=function(){ if(clickCount===0) firstClick(); else openSeq(); };
document.getElementById('goBtn').onclick=function(){ location.href='index.html?id='+idParam; };
</script>
</body>
</html>
