<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gina & Edy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf4e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Times New Roman',serif;overflow:hidden}
.top{font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:.7;margin-bottom:60px}
.stage{position:relative;width:520px;max-width:88vw;aspect-ratio:1.4/1;display:flex;align-items:center;justify-content:center;background:transparent !important}
#ondaVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent !important;border:none}
.envelope{position:relative;z-index:2;width:100%;cursor:pointer;filter:drop-shadow(0 25px 40px rgba(0,0,0,.25));transition:.5s}
.envelope:hover{transform:translateY(-6px) scale(1.02)}
#soundBtn{position:fixed;top:28px;right:28px;width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.12);cursor:pointer;font-size:18px;z-index:20}
</style>
</head>
<body>
<button id="soundBtn">🔇</button>
<div class="top">Tienes una invitación</div>

<div class="stage">
  <video id="ondaVideo" loop muted playsinline autoplay preload="auto">
    <source src="sobre_onda.mp4" type="video/mp4">
  </video>
  <!-- Usa tu sobre con sombra como imagen -->
  <img class="envelope" id="env" src="sobre_verde.png" alt="Sobre">
</div>

<script>
const video=document.getElementById('ondaVideo');
const env=document.getElementById('env');
const btn=document.getElementById('soundBtn');
let on=false;
video.play().catch(()=>{});

function activar(){
 if(on) return;
 on=true;
 video.muted=false;
 video.volume=0.6;
 video.play();
 btn.textContent='🔊';
}
function toggle(){
 if(!on) activar();
 else{ video.muted=!video.muted; btn.textContent=video.muted?'🔇':'🔊'; }
}
env.addEventListener('click',()=>{
 activar();
 env.style.transform='scale(1.08)';
 setTimeout(()=>{ location.href='invitacion.html'+location.search; },600);
});
btn.addEventListener('click',toggle);
</script>
</body>
</html>
