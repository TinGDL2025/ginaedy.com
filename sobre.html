<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy - Sobre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Great+Vibes&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fdfaf6;padding:20px}
.top{ text-align:center; margin-bottom:18px}
.top i{font-family:'Cormorant Garamond',serif;font-style:italic;color:#c2a68a;font-size:22px}
.top b{display:block;font-family:'Cormorant Garamond',serif;font-weight:700;color:#1e3d2f;font-size:26px;margin-top:6px}
.stage{width:96vw;max-width:680px;position:relative;transition:opacity .9s ease}
.stage.out{opacity:0;pointer-events:none}
.video-box{width:92vw;max-width:520px;aspect-ratio:3/4.8;margin:0 auto;overflow:hidden;background:transparent;position:relative;border-radius:0;box-shadow:none;-webkit-mask-image: radial-gradient(ellipse at center, black 68%, rgba(0,0,0,0.6) 80%, transparent 98%);mask-image: radial-gradient(ellipse at center, black 68%, rgba(0,0,0,0.6) 80%, transparent 98%)}
#ondaVideo{width:100%;height:100%;object-fit:contain;transform:scale(1.60);position:absolute;inset:0}
#confetiVideo{display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transform:scale(0.72);opacity:0;transition:opacity .5s,transform .6s}
#confetiVideo.active{display:block;opacity:1}
#confetiVideo.zoom-final{transform:scale(1.02)}
.seal-hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;z-index:5;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 0 36px;pointer-events:none}
.overlay button{pointer-events:auto;background:rgba(255,255,255,.92);border:0;padding:8px 18px;border-radius:20px;font-size:11px;cursor:pointer}
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .9s}
.card-layer.active{pointer-events:auto;opacity:1}
.card{width:92vw;max-width:400px;background:#fff;border-radius:22px;padding:42px 32px 36px;text-align:center;min-height:560px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.guest{font-family:'Cormorant Garamond',serif;font-size:28px;color:#1a3a2f;margin-top:4px}
.small-label{font-size:10px;letter-spacing:.32em;color:#9a9a9a}
.con-amor{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:#8a6a5a;margin-top:8px}
.divider{width:42px;height:1px;background:#e6d5c3;margin:18px auto}
.nos-casamos{font-family:'Great Vibes',cursive;font-size:48px;color:#1a3a2f}
.gina{font-family:'Cormorant Garamond',serif;font-size:22px;color:#1a3a2f;margin-top:14px}
.fecha{font-size:10px;letter-spacing:.2em;color:#7a8a85;margin-top:6px}
.seal-wrap{position:relative;margin-top:28px;width:68px;height:68px;cursor:pointer}
.seal-final{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #e8d0a0, #c8a86a);border:1px solid #b8975a;color:#5a3a20;display:flex;align-items:center;justify-content:center}
.ver{font-size:9px;letter-spacing:.24em;color:#5a6a65;margin-top:18px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><i>Tienes una invitación</i><b id="labelId">Cargando...</b></div>
<div class="stage" id="stage">
  <div class="video-box" id="videoBox">
    <video id="ondaVideo" autoplay loop muted playsinline><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <div class="overlay"><button id="hint">Toca el sello</button></div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>
<div class="card-layer" id="cardLayer">
  <div class="card">
    <div class="small-label">TIENES UNA INVITACIÓN</div>
    <div class="con-amor">Con amor,</div>
    <div class="guest" id="guest">Cargando...</div>
    <div class="divider"></div>
    <div class="nos-casamos">Nos casamos</div>
    <div class="gina">Gina & Edy</div>
    <div class="fecha">02.01.27</div>
    <div class="seal-wrap" id="sealFinal"><div class="seal-final">G&E</div></div>
    <div class="ver" id="verBtn">VER INVITACIÓN COMPLETA</div>
  </div>
</div>
<script>
// Videos - NO TOCAR
(()=>{const onda=document.getElementById('ondaVideo'),conf=document.getElementById('confetiVideo'),hint=document.getElementById('hint'),stage=document.getElementById('stage'),cardLayer=document.getElementById('cardLayer'),seal=document.getElementById('seal'),sealFinal=document.getElementById('sealFinal'),verBtn=document.getElementById('verBtn');onda.muted=true;onda.play().catch(()=>{});let soundOn=false,clickCount=0,opened=false;function enableSound(){if(soundOn)return;soundOn=true;onda.muted=false;onda.volume=0.6;onda.play();conf.muted=false;}function firstClick(){enableSound();clickCount=1;hint.textContent='Ahora ábrelo ✨';}function openSeq(){if(opened)return;opened=true;hint.style.opacity='0';conf.classList.add('active');conf.currentTime=0;conf.muted=false;conf.volume=0.9;conf.play();setTimeout(()=>{onda.style.opacity='0';},500);setTimeout(()=>{onda.pause();},800);conf.ontimeupdate=()=>{if(conf.currentTime>=2.2&&!conf.classList.contains('zoom-final'))conf.classList.add('zoom-final');if(conf.currentTime>=2.85){conf.pause();stage.classList.add('out');cardLayer.classList.add('active');}}}seal.onclick=()=>{if(clickCount===0)firstClick();else openSeq();};hint.onclick=()=>{if(clickCount===0)firstClick();else openSeq();};function goToIndex(){const id=new URLSearchParams(location.search).get('id')||'001';location.href='index.html?id='+id;}sealFinal.onclick=goToIndex;verBtn.onclick=goToIndex;})();
</script>
<script>
// === GS - TECNICA EXACTA DE TU ADMIN.HTML QUE SI FUNCIONA AL 100% ===
const GS_URL='https://script.google.com/macros/s/AKfycbwWk1g0LJWg1eQ3f2VH5c43UrsMIiB8YLPXpVchr5Ejaynvn38c8cH_TDuYDuYToJd8tgpmw/exec';
const idParam=new URLSearchParams(window.location.search).get('id')||'001';

function pintarSobre(B2,obj){
  const elL=document.getElementById('labelId'),elG=document.getElementById('guest');
  if(!B2){
    const msg=obj&&obj.status==="no encontrado"?"ID no encontrado: "+(obj.id||idParam):"ID: "+idParam;
    if(elL)elL.textContent=msg;if(elG)elG.textContent=msg;return;
  }
  if(elL)elL.textContent=B2;if(elG)elG.textContent=B2;
}

function jsonp(u,cb){
  const n='cb_'+Date.now()+Math.random().toString(36).slice(2);
  let handled=false;
  const timer=setTimeout(()=>{if(!handled){handled=true;delete window[n];if(s&&s.parentNode)s.remove();document.getElementById('labelId').textContent='Error carga GS (timeout)';}},10000);
  window[n]=d=>{if(!handled){handled=true;clearTimeout(timer);try{cb(d);}finally{delete window[n];if(s&&s.parentNode)s.remove();}}};
  const s=document.createElement('script');
  s.src=u+(u.includes('?')?'&':'?')+'callback='+n;
  s.onerror=()=>{if(!handled){handled=true;clearTimeout(timer);delete window[n];if(s&&s.parentNode)s.remove();document.getElementById('labelId').textContent='Error carga GS';document.getElementById('guest').textContent='Error carga GS';}};
  document.body.appendChild(s);
}

jsonp(GS_URL+"?id="+encodeURIComponent(idParam),function(obj){
  console.log('GS obj:',obj);
  if(!obj){pintarSobre(null,null);return;}
  if(obj.status==="no encontrado"){pintarSobre(null,obj);return;}
  if(obj.status==="ya_confirmado")obj.confirmado=true;
  const B2=obj.t||obj.titular||'';
  pintarSobre(B2,obj);
});
</script>
</body>
</html>
