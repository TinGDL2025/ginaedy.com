<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gina & Edy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f2ebe1;overflow:hidden}
.stage{width:96vw;max-width:680px;position:relative;transition:opacity .9s ease}
.stage.out{opacity:0;pointer-events:none}
.video-box{width:95%;margin:0 auto;aspect-ratio:16/8.2;overflow:hidden;background:#f2ebe1;position:relative}
.video-box video{width:100%;height:95%;object-fit:cover;display:block;background:#f2ebe1}
#ondaVideo{position:absolute;inset:0;z-index:1;width:100%;height:95%}
#confetiVideo{position:absolute;inset:0;z-index:2;display:none;width:100%;height:95%}
#confetiVideo.active{display:block}
.seal-hit{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;z-index:5;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0;pointer-events:none}
.overlay button{pointer-events:auto;background:rgba(255,255,255,.9);border:0;padding:8px 18px;border-radius:20px;font-size:11px;letter-spacing:.2em;cursor:pointer}
.card-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .9s ease}
.card-layer.active{pointer-events:auto;opacity:1}
.card{width:95%;max-width:400px;background:#fff;border-radius:22px;padding:32px;text-align:center}
#goldConfetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
</style>
</head>
<body>
<canvas id="goldConfetti"></canvas>

<div class="stage" id="stage">
  <div class="video-box">
    <video id="ondaVideo" autoplay loop muted playsinline><source src="sobre_onda.mp4" type="video/mp4"></video>
    <video id="confetiVideo" playsinline muted><source src="sobre_confeti.mp4" type="video/mp4"></video>
    <div class="overlay"><div style="font-size:10px;letter-spacing:.3em" id="guestTop">Tienes una invitación</div><button id="hint">Toca el sello</button></div>
    <div class="seal-hit" id="seal"></div>
  </div>
</div>

<div class="card-layer" id="cardLayer">
  <div class="card">
    <div id="guest">Invitado Especial</div>
    <div style="font-size:40px;margin:10px 0">Nos casamos<br>Gina & Edy</div>
    <button id="go">Ver invitación completa</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
/* ===== 1. CONEXION SHEET (TU APP) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbwWk1g0LJWg1eQ3f2VH5c43UrsMIiB8YLPXpVchr5Ejaynvn38c8cH_TDuYToJd8tgpmw/exec';
function getId(){ return new URLSearchParams(location.search).get('id') || '001'; }
async function loadGuest(){
  try{
    const res = await fetch(APP_URL);
    const data = await res.json();
    const id = getId();
    const item = data.find(r=>String(r.id)===String(id));
    if(item){
      document.getElementById('guest').textContent = item.titular;
      document.getElementById('guestTop').textContent = item.titular;
    }
  }catch(e){ console.log('Sheet error', e); }
}
loadGuest();

/* ===== 2. CONFETI DORADO ===== */
function launchGoldConfetti(){
  const myConf = confetti.create(document.getElementById('goldConfetti'), {resize:true,useWorker:true});
  myConf({particleCount:28, spread:75, startVelocity:24, origin:{y:0.25}, colors:['#d4af37','#c8a86a','#e8d0a0','#b8975a'], scalar:0.8, ticks:250});
  setTimeout(()=>{ myConf({particleCount:15, spread:90, origin:{y:0}, colors:['#d4af37','#c8a86a'], gravity:0.6, scalar:0.6, ticks:300}); }, 450);
}

/* ===== 3. LOGICA SOBRE - AQUI ESTA EL OPEN QUE PREGUNTAS ===== */
var onda=document.getElementById('ondaVideo');
var conf=document.getElementById('confetiVideo');
var hint=document.getElementById('hint');
var stage=document.getElementById('stage');
var cardLayer=document.getElementById('cardLayer');
onda.muted=true; onda.play().catch(()=>{});
var soundOn=false, clickCount=0, opened=false;

function enableSound(){ if(soundOn) return; soundOn=true; onda.muted=false; onda.volume=0.6; onda.play(); conf.muted=false; }
function firstClick(){ enableSound(); clickCount=1; hint.textContent='Ahora ábrelo ✨'; }

function openSeq(){   // <--- ESTE ES EL OPEN
  if(opened) return; opened=true;
  hint.style.opacity='0';
  setTimeout(()=>{
    conf.classList.add('active');
    conf.currentTime=0; conf.muted=false; conf.volume=0.9; conf.play(); onda.pause();
  },120);
  
  // AQUI ABAJO ES DONDE SE ACTIVA LA HOJA FINAL + CONFETI
  conf.ontimeupdate=()=>{
    if(conf.currentTime>=2.85){
      conf.pause();
      stage.classList.add('out');
      cardLayer.classList.add('active');
      setTimeout(launchGoldConfetti, 300); // <-- CONFETI DORADO AL ENTRAR
    }
  }
}

document.getElementById('seal').onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
hint.onclick=()=>{ if(clickCount===0) firstClick(); else openSeq(); };
document.getElementById('go').onclick=()=>{ window.location.href='index.html?id='+getId(); };
</script>
</body>
</html>
